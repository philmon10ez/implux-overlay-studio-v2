# Poptek — STAGING Shopify app (custom / non-production)
# Client ID: 786f52ea5cd6c4e9c95a835dfecd2ecb
#
# Deploy ONLY with explicit intent:
#   npm run deploy:staging
#
# Staging Railway application URL. OAuth redirect URLs use only /auth/callback,
# the callback path derived from authPathPrefix in app/shopify.server.js.

name = "Poptek by Implux (Staging)"
client_id = "786f52ea5cd6c4e9c95a835dfecd2ecb"
application_url = "https://poptek-shopify-staging-staging.up.railway.app"
embedded = true

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"

[access_scopes]
scopes = "read_orders,read_themes"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://poptek-shopify-staging-staging.up.railway.app/auth/callback"
]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false

[app_proxy]
url = "https://implux-overlay-studio-v2-staging.up.railway.app/proxy"
prefix = "apps"
subpath = "poptek"
