# DEPRECATED — use environment-specific Shopify CLI configs instead:
#
#   shopify.app.production.toml  → LIVE Poptek app (bfcae2d7…)
#   shopify.app.staging.toml     → Staging app (786f52ea…)
#
# Deploy with npm run deploy:production or npm run deploy:staging (never bare `npm run deploy`).
#
# This file mirrors production for Shopify CLI default resolution only.
# Canonical production config: shopify.app.production.toml

name = "Poptek by Implux"
client_id = "bfcae2d7ecd83eb4fc96749fb543380c"
application_url = "https://stunning-friendship-production.up.railway.app"
embedded = true

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"

[access_scopes]
scopes = "read_orders,read_themes"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://stunning-friendship-production.up.railway.app/auth/callback",
  "https://stunning-friendship-production.up.railway.app/auth/shopify/callback"
]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
